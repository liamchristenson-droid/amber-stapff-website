[build]
  command = "npm run build"
  publish = "dist"
  # Editor saves are drafts: only rebuild when "Publish website" is pressed (see scripts/should-build.sh)
  ignore = "bash scripts/should-build.sh"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for hashed build assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
